<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رؤية | إنشاء حساب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 40%, #f5f3ff 100%);
            padding: 20px;
        }
        .register-card {
            background: white;
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            animation: fadeInUp 0.6s ease;
        }
        .register-card .form-group { margin-bottom: 18px; }
        .register-card .form-group label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; color: var(--text); }
        .register-card .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            background: #f8fafc;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .register-card .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }
        .register-card .form-group small {
            display: block;
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .register-card .login-logo { text-align: center; margin-bottom: 28px; }
        .register-card .login-logo img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 12px; }
        .register-card .login-logo h1 { font-size: 2rem; font-weight: 800; color: var(--primary-dark); }
        .register-card .login-logo p { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #4ade80);
            color: white;
            box-shadow: 0 4px 14px rgba(34,197,94,0.35);
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34,197,94,0.4);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .register-card .login-link { margin-top: 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
        .register-card .login-link a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .register-card .login-link a:hover { text-decoration: underline; }
        #registerMessage { margin-top: 16px; text-align: center; font-weight: 600; font-size: 0.95rem; min-height: 28px; }
        #registerMessage.error { color: var(--danger); }
        #registerMessage.success { color: var(--success); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-card">
            <div class="login-logo">
                <img src="assets/logo.png" alt="رؤية">
                <h1>رؤية</h1>
                <p>إنشاء حساب جديد</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>👤 الاسم الثلاثي</label>
                    <input type="text" id="fullName" placeholder="مثال: أحمد محمد نادي" required>
                </div>

                <div class="form-group">
                    <label>🎓 رقم الطالب (رقم الجلوس)</label>
                    <input type="text" id="studentId" placeholder="مثال: 470994914" required>
                    <small>رقم الجلوس المدرسي مكون من 7-9 أرقام</small>
                </div>

                <div class="form-group">
                    <label>📧 الإيميل المؤسسي</label>
                    <input type="email" id="schoolEmail" placeholder="مثال: 470994914@cairo7.moe.edu.eg" required>
                    <small>يجب أن يكون بصيغة: <strong>رقم_الطالب@محافظة.moe.edu.eg</strong></small>
                </div>

                <div class="form-group">
                    <label>📱 رقم ولي الأمر</label>
                    <input type="tel" id="parentPhone" placeholder="مثال: 01001234567" required>
                    <small>رقم هاتف مصري 11 رقم (يبدأ بـ 01)</small>
                </div>

                <div class="form-group">
                    <label>🔑 كلمة السر</label>
                    <input type="password" id="password" placeholder="********" required minlength="6">
                    <small>يجب أن تكون 6 أحرف على الأقل</small>
                </div>

                <div class="form-group">
                    <label>🔐 تأكيد كلمة السر</label>
                    <input type="password" id="confirmPassword" placeholder="********" required>
                </div>

                <button type="submit" class="btn-primary" id="registerBtn">🚀 إنشاء الحساب</button>

                <div id="registerMessage"></div>

                <div class="login-link">
                    لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        window.handleRegister = async function(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const schoolEmail = document.getElementById('schoolEmail').value.trim();
            const parentPhone = document.getElementById('parentPhone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('registerMessage');
            const btn = document.getElementById('registerBtn');

            messageEl.textContent = '';
            messageEl.className = '';
            btn.disabled = true;
            btn.textContent = '⏳ جاري...';

            // التحقق من الحقول
            if (fullName.length < 6) {
                messageEl.textContent = '⚠️ الاسم يجب أن يكون ثلاثي على الأقل';
                messageEl.className = 'error';
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء الحساب';
                return;
            }

            if (!/^\d{7,9}$/.test(studentId)) {
                messageEl.textContent = '⚠️ رقم الطالب يجب أن يكون 7-9 أرقام';
                messageEl.className = 'error';
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء الحساب';
                return;
            }

            const emailPattern = /^[0-9]+@[a-zA-Z0-9]+\.moe\.edu\.eg$/;
            if (!emailPattern.test(schoolEmail)) {
                messageEl.textContent = '⚠️ الإيميل يجب أن يكون بصيغة: رقم_الطالب@محافظة.moe.edu.eg';
                messageEl.className = 'error';
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء الحساب';
                return;
            }

            if (!/^01[0-9]{9}$/.test(parentPhone)) {
                messageEl.textContent = '⚠️ رقم ولي الأمر يجب أن يكون 11 رقم مصري (مثال: 01001234567)';
                messageEl.className = 'error';
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء الحساب';
                return;
            }

            if (password.length < 6) {
                messageEl.textContent = '⚠️ كلمة السر يجب أن تكون 6 أحرف على الأقل';
                messageEl.className = 'error';
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء الحساب';
                return;
            }

            if (password !== confirmPassword) {
                messageEl.textContent = '⚠️ كلمة السر غير متطابقة';
                messageEl.className = 'error';
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء الحساب';
                return;
            }

            try {
                // محاولة التسجيل في السيرفر
                const result = await window.registerUser(fullName, schoolEmail, password, 'medicine', '2');
                
                if (result && result.id) {
                    // ✅ بناء كائن المستخدم يدوياً (لأن السيرفر بيرجع id بس)
                    const userData = {
                        id: result.id,
                        name: fullName,
                        email: schoolEmail,
                        path: 'medicine',
                        year: '2',
                        specialization: '',
                        weakSubjects: [],
                        preferredTime: 'morning',
                        goalScore: 500,
                        onboardingDone: false,
                        points: 0,
                        streak: 0,
                        progress: 0,
                        completedTasks: {},
                        badges: {},
                        weeklyProgress: {},
                        lastPathChange: null,
                        avatarUrl: '',
                        createdAt: new Date().toISOString()
                    };

                    // حفظ في localStorage
                    localStorage.setItem('ruaya_user', JSON.stringify(userData));

                    messageEl.textContent = '✅ تم التسجيل بنجاح! جارٍ التحويل...';
                    messageEl.className = 'success';
                    
                    setTimeout(() => {
                        window.location.href = 'onboarding.html';
                    }, 1500);
                } else {
                    throw new Error('لم يتم استلام ID من السيرفر');
                }

            } catch (error) {
                console.error('❌ خطأ في التسجيل:', error);
                messageEl.textContent = error.message || '❌ حدث خطأ في التسجيل';
                messageEl.className = 'error';
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء الحساب';
            }
        };
    </script>
</body>
</html>
