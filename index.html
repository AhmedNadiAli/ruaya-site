<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رؤية | الصفحة الرئيسية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card" style="max-width:420px;">
            <div class="login-logo">
                <img src="assets/logo.png" alt="رؤية">
                <h1>رؤية</h1>
                <p>نظام البكالوريا المصري</p>
            </div>

            <div class="login-btns" style="display:flex; flex-direction:column; gap:12px; margin-top:24px;">
                <!-- ✅ الرابط يودي لـ register.html (إنشاء حساب) -->
                <a href="register.html" class="btn btn-primary btn-full" style="text-align:center; text-decoration:none;">
                    🚀 ابدأ رحلتك
                </a>
                <!-- ✅ إضافة رابط تسجيل الدخول (للي عنده حساب) -->
                <a href="login.html" class="btn btn-google btn-full" style="text-align:center; text-decoration:none;">
                    🔓 تسجيل الدخول
                </a>
            </div>

            <p style="margin-top:20px;text-align:center;color:var(--text-muted);font-size:0.8rem;">
                منصة رؤية - لطلاب البكالوريا فقط
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // التحقق من تسجيل الدخول (لو في مستخدم مسجل)
        const user = localStorage.getItem('ruaya_user');
        if (user) {
            try {
                const parsed = JSON.parse(user);
                // لو التهيئة مخلصة، يودي للـ Dashboard عشان مايرجعش للصفحة الرئيسية
                if (parsed.onboardingDone) {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'onboarding.html';
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
