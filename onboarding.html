<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رؤية | التهيئة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="onboarding-page">
        <div class="onboarding-card">
            <div class="onboarding-header">
                <h2>خلينا نتعرف عليك 👋</h2>
                <p>جاوب على الأسئلة دي عشان نجهزلك خطة مناسبة</p>
            </div>
            <div class="progress-steps">
                <div class="step-dot active" id="dot1"></div>
                <div class="step-dot" id="dot2"></div>
                <div class="step-dot" id="dot3"></div>
                <div class="step-dot" id="dot4"></div>
            </div>

            <!-- Step 1: الاسم + المسار -->
            <div id="step1">
                <div class="form-group">
                    <label>اسمك الثلاثي</label>
                    <input type="text" id="fullNameInput" placeholder="مثال: أحمد محمد نادي" style="width:100%; padding:12px 16px; border:1.5px solid var(--border); border-radius:12px; font-family:'Cairo',sans-serif; font-size:1rem; background:#f8fafc; box-sizing:border-box;">
                </div>
                <div class="form-group">
                    <label>ما هو مسارك؟</label>
                    <div class="options-grid" id="pathOptions">
                        <button type="button" class="option-btn" data-value="medicine">طب وعلوم حياة</button>
                        <button type="button" class="option-btn" data-value="engineering">هندسة وعلوم حاسب</button>
                        <button type="button" class="option-btn" data-value="arts">آداب وفنون</button>
                        <button type="button" class="option-btn" data-value="business">إدارة أعمال</button>
                    </div>
                </div>
                <button class="btn btn-primary btn-full" onclick="nextStep(1)">التالي</button>
            </div>

            <!-- Step 2: السنة + التخصص -->
            <div id="step2" style="display:none;">
                <div class="form-group">
                    <label>السنة الدراسية</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn year-btn" data-value="2">السنة التانية</button>
                        <button type="button" class="option-btn year-btn" data-value="3">السنة التالتة</button>
                    </div>
                </div>
                <div class="form-group" id="specGroup">
                    <label>مادة التخصص الاختيارية</label>
                    <div class="options-grid" id="specOptions"></div>
                </div>
                <div id="subjectsDisplay" style="display:none; background:#f0fdf4; padding:12px; border-radius:12px; margin-top:10px;">
                    <p style="font-weight:700; margin-bottom:4px;">📚 موادك في السنة التالتة:</p>
                    <p id="subjectsText" style="color:var(--text-muted);"></p>
                </div>
                <div style="display:flex; gap:10px; margin-top:16px;">
                    <button class="btn btn-google" style="flex:1;" onclick="prevStep(2)">رجوع</button>
                    <button class="btn btn-primary" style="flex:2;" onclick="nextStep(2)">التالي</button>
                </div>
            </div>

            <!-- Step 3: المواد الضعيفة والهدف -->
            <div id="step3" style="display:none;">
                <div class="form-group">
                    <label>المواد اللي محتاج تركز عليها أكتر (اختياري)</label>
                    <div class="options-grid" id="weakOptions">
                        <button type="button" class="option-btn weak-btn" data-value="عربي">عربي</button>
                        <button type="button" class="option-btn weak-btn" data-value="إنجليزي">إنجليزي</button>
                        <button type="button" class="option-btn weak-btn" data-value="تاريخ">تاريخ وطني</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>هدفك من الـ 600 درجة؟</label>
                    <input type="number" id="goalScore" min="200" max="600" value="500" placeholder="مثال: 520">
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-google" style="flex:1;" onclick="prevStep(3)">رجوع</button>
                    <button class="btn btn-primary" style="flex:2;" onclick="nextStep(3)">التالي</button>
                </div>
            </div>

            <!-- Step 4: الوقت المفضل -->
            <div id="step4" style="display:none;">
                <div class="form-group">
                    <label>بتحب تذاكر في أنهي وقت؟</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn time-btn" data-value="morning">الصباح</button>
                        <button type="button" class="option-btn time-btn" data-value="afternoon">بعد الظهر</button>
                        <button type="button" class="option-btn time-btn" data-value="evening">بالليل</button>
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-google" style="flex:1;" onclick="prevStep(4)">رجوع</button>
                    <button class="btn btn-primary" style="flex:2;" onclick="finishOnboarding()">ابدأ رحلتي 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let formData = {
            name: '',
            path: '',
            year: '',
            specialization: '',
            weakSubjects: [],
            goalScore: 500,
            preferredTime: ''
        };

        // ==========================================
        // 1. المسار + تحديث التخصصات
        // ==========================================
        document.querySelectorAll('#pathOptions .option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#pathOptions .option-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                formData.path = this.dataset.value;
                formData.specialization = '';
                updateSpecOptions(formData.path);
                document.querySelectorAll('.spec-btn').forEach(b => b.classList.remove('selected'));
            });
        });

        // ==========================================
        // 2. تحديث خيارات التخصص حسب المسار
        // ==========================================
        function updateSpecOptions(path) {
            const specs = window.getSpecializationOptions(path);
            const container = document.getElementById('specOptions');
            container.innerHTML = '';
            specs.forEach(s => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-btn spec-btn';
                btn.dataset.value = s;
                btn.textContent = s;
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.spec-btn').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    formData.specialization = s;
                });
                container.appendChild(btn);
            });
        }

        // ==========================================
        // 3. السنة
        // ==========================================
        document.querySelectorAll('.year-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                formData.year = this.dataset.value;
                updateYearDisplay();
            });
        });

        function updateYearDisplay() {
            const specGroup = document.getElementById('specGroup');
            const subjectsDisplay = document.getElementById('subjectsDisplay');
            if (formData.year === '2') {
                specGroup.style.display = 'block';
                subjectsDisplay.style.display = 'none';
            } else {
                specGroup.style.display = 'none';
                subjectsDisplay.style.display = 'block';
                const subjects = window.getUserSubjects({ year: '3', path: formData.path });
                document.getElementById('subjectsText').textContent = subjects.join(' - ');
                formData.specialization = '';
                document.querySelectorAll('.spec-btn').forEach(b => b.classList.remove('selected'));
            }
        }

        // ==========================================
        // 4. المواد الضعيفة
        // ==========================================
        document.querySelectorAll('.weak-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('selected');
                const val = this.dataset.value;
                if (this.classList.contains('selected')) {
                    if (!formData.weakSubjects.includes(val)) formData.weakSubjects.push(val);
                } else {
                    formData.weakSubjects = formData.weakSubjects.filter(s => s !== val);
                }
            });
        });

        // ==========================================
        // 5. الوقت المفضل
        // ==========================================
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                formData.preferredTime = this.dataset.value;
            });
        });

        // ==========================================
        // 6. دوال التنقل
        // ==========================================
        function updateDots(step) {
            for (let i = 1; i <= 4; i++) {
                document.getElementById('dot' + i).classList.toggle('active', i <= step);
            }
        }

        function showStep(n) {
            for (let i = 1; i <= 4; i++) {
                document.getElementById('step' + i).style.display = i === n ? 'block' : 'none';
            }
            updateDots(n);
        }

        window.nextStep = function(current) {
            if (current === 1) {
                const nameVal = document.getElementById('fullNameInput').value.trim();
                if (!nameVal) { alert('من فضلك اكتب اسمك الثلاثي'); return; }
                if (!formData.path) { alert('اختار مسارك أولاً'); return; }
                formData.name = nameVal;
                showStep(2);
                updateYearDisplay();
                return;
            } else if (current === 2) {
                if (!formData.year) { alert('اختار السنة أولاً'); return; }
                if (formData.year === '2' && !formData.specialization) {
                    alert('اختار مادة التخصص');
                    return;
                }
                showStep(3);
            } else if (current === 3) {
                formData.goalScore = parseInt(document.getElementById('goalScore').value) || 500;
                showStep(4);
            }
        };

        window.prevStep = function(current) { showStep(current - 1); };

        window.finishOnboarding = function() {
            // التحقق من وقت المذاكرة
            if (!formData.preferredTime) {
                alert('اختار وقت المذاكرة المفضل');
                return;
            }
            if (!formData.name) {
                alert('في مشكلة في الاسم، ارجع لأول خطوة');
                showStep(1);
                return;
            }

            // ✅ حفظ البيانات (مع تجاهل الأخطاء)
            try {
                saveOnboardingData(formData);
            } catch (e) {
                console.error('❌ خطأ:', e);
                // حتى لو حصل خطأ، نحاول نروح للـ Dashboard
                window.location.href = 'dashboard.html';
            }
        };

        showStep(1);
    </script>
</body>
</html>
